<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../index.css">
    <link rel="stylesheet" href="index.css">
    <title>刀口亼右户仨亼レ仨 🎬 Микшер (управление)</title>
</head>
<body>
    <script src="../../navigation.js"></script>
    <div class="page-container">
        <h1>🎚️ Микшер аудио и видео</h1>
        <p>Выберите источники и настройте слои. Видео можно перемещать и масштабировать.</p>

        <!-- Карточка видео-микшера (без инлайн-стилей) -->
        <div class="settings-card video-mixer-card">
            <h3>🎬 Видео-микшер</h3>
            <div class="video-stage-wrapper">
                <div class="video-stage" id="video-stage">
                    <canvas id="preview-canvas" class="preview-canvas"></canvas>
                    <div class="video-layers-container" id="video-layers-container"></div>
                </div>
            </div>
            <button id="fullscreen-window-btn" class="fullscreen-window-btn">⛶ Открыть плеер</button>
			<button id="pip-btn" class="fullscreen-window-btn" style="right: 120px;">🖼️ PiP</button>
        </div>

        <!-- Громкость прослушивания -->
        <div class="settings-card">
            <h3>🔊 Прослушивание микшера</h3>
            <div class="device-item">
                <div class="source-item">
                    <label>Громкость прослушивания</label>
                    <input type="range" id="listen-volume" min="0" max="100" value="100" class="volume-slider">
                    <span id="listen-volume-value" class="volume-value">100%</span>
                </div>
            </div>
        </div>

        <!-- Микрофоны -->
        <div class="settings-card">
            <h3>🎤 Микрофоны</h3>
            <div id="devices-section"></div>
        </div>

        <!-- Внешние источники -->
        <div class="settings-card">
            <h3>🌐 Внешние источники</h3>
            <button id="add-screen-source-btn" class="primary-button">🖥️ Добавить экран/окно</button>
            <button id="add-camera-source-btn" class="primary-button">📷 Добавить камеру</button>
            <div id="sources-list"></div>
        </div>
    </div>
    <script src="manager.js"></script>
</body>
</html>
