<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../index.css">
    <title>刀口亼右户仨亼レ仨 🔐 Шифрование</title>
</head>
<body>
    <script src="../../navigation.js"></script>
    <div class="page-container">
        <h2>🔐 Настройки шифрования</h2>

        <div class="settings-card">
            <div class="setting-item">
                <label for="encryptKey">Ключ шифрования (пароль)</label>
                <input type="password" id="encryptKey" placeholder="Введите пароль для шифрования">
            </div>

            <div class="setting-item">
                <label for="decryptKey">Ключ расшифровки (если отличается)</label>
                <input type="password" id="decryptKey" placeholder="Оставьте пустым, чтобы использовать ключ шифрования">
            </div>
        </div>

        <div class="settings-card">
            <div class="setting-item">
                <input type="checkbox" id="encryptEnabled" checked>
                <div>
                    <label for="encryptEnabled">Включить шифрование исходящих сообщений</label>
                </div>
            </div>

            <div class="setting-item">
                <input type="checkbox" id="decryptEnabled" checked>
                <div>
                    <label for="decryptEnabled">Включить расшифровку входящих сообщений</label>
                </div>
            </div>

            <div class="setting-item">
                <input type="checkbox" id="protectInput" checked>
                <div>
                    <label for="protectInput">Защита ввода от браузера (скрывает набираемый текст от сайта)</label>
                </div>
            </div>
        </div>

        <div class="note">
            Используйте <kbd>Enter</kbd> для отправки зашифрованного сообщения.<br>
            Может не работать на некоторых сайтах.<br>
            После изменений перезагрузите целевую страницу.
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
